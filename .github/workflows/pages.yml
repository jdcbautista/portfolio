# Builds the Vite app and deploys it to GitHub Pages on every push to main.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        timeout-minutes: 15
        run: |
          ( while true; do echo "[MON $(date +%T)] $(free -m | awk '/Mem:/{printf "used %d free %d avail %d / %d MB",$3,$4,$7,$2}')"; sleep 8; done ) &
          MON=$!
          set +e; npm run build; RC=$?; set -e
          kill "$MON" 2>/dev/null || true
          echo "=== build rc=$RC ==="; exit $RC
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
